# Shared defaults for selector + LoRA SFT sweeps.
model_name: allenai/OLMo-2-1124-7B
selectors: ["full", "random", "dsir", "less", "prismatic", "safe"]
subset_percentages: [5.0, 15.0]
seed: 42

selector_feature_method: low_rank
selector_preconditioner: adam
# Legacy behavior remains the default. Set this to
# precondition_before_projection for U_K^T D_0^{-1} g candidate features.
adam_selection_mode: post_projection
safe_geometry: reference
safe_solver: constrained_greedy
save_selected_artifacts: false

max_seq_len: 2048
selector_projection_dim: 8192
selector_projection_seed: 13
selector_projection_chunk_size: 1048576
selector_projection_cache_dtype: float16
low_rank_candidate_max_examples: 5000
low_rank_candidate_projection_chunk_rows: 256
reference_fisher_max_examples: 1024
validation_gradient_max_examples: 128
train_max_seq_length: 1024
train_torch_dtype: float32
train_lora_r: 32
train_lora_alpha: 32
train_lora_dropout: 0.05
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
num_train_epochs: 1.0

evaluator: humaneval
generation_max_new_tokens: 256
compute_entanglement_metrics: false
entanglement_target_sample_size: 128
entanglement_selected_csv_max_rows: 5000
humaneval_num_samples: 1
humaneval_pass_at_ks: [1]
humaneval_temperature: 0.8
humaneval_top_p: 0.95
