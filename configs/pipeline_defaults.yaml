seed: 42
output_root: outputs/rebuttal
run_baselines: true
baseline_selectors: ["full", "random", "dsir", "less", "prismatic"]
subset_percentages: [5.0, 15.0]

splits:
  candidate_adam_warmup: 0.03
  candidate_selection: 0.97
  target: [0.34, 0.33, 0.33]
  reference: [0.5, 0.5]

selection:
  lora_r: 2
  lora_alpha: 4
  lora_dropout: 0.0
  lora_target_modules: ["q_proj"]
  max_seq_len: 1024
  selector_feature_method: low_rank
  selector_preconditioner: adam
  save_selected_artifacts: false
  # Random-sketch feature parameters. These are ignored when
  # selector_feature_method: low_rank, but kept here for explicit ablations.
  selector_projection_dim: 8192
  selector_projection_seed: 13
  selector_projection_chunk_size: 1048576
  selector_projection_cache_dtype: float16
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  adam_warmup_steps: 0.03
  low_rank_delta: 0.01
  low_rank_delta_task: 0.01
  low_rank_builder_alpha: 1.0e-3
  # Low-rank basis estimation uses at most this many post-warmup candidates.
  # All post-warmup candidates are still projected into the learned basis.
  low_rank_candidate_max_examples: 5000
  low_rank_candidate_projection_chunk_rows: 256
  reference_fisher_max_examples: 1024
  validation_gradient_max_examples: 256
  safe_geometry: reference
  safe_solver: greedy_marginal
  safe_learning_rate: 1.0

safe:
  epsilon: 1.0
  rho_values: [0.1, 0.3, 1.0, 3.0]

training:
  train_max_seq_length: 1024
  train_torch_dtype: float32
  train_lora_dropout: 0.05
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  num_train_epochs: 1.0
  eval_steps: 20
  logging_steps: 1

evaluation:
  generation_max_new_tokens: 128
  eval_max_examples: null
  compute_entanglement_metrics: false
  entanglement_target_sample_size: 128
  entanglement_selected_csv_max_rows: 5000
  run_entanglement_analysis: true
  entanglement_selector_top_k: 200

rank_grid:
  - name: KR1024_KT256
    K_R: 1024
    K_T: 256
  - name: KR512_KT128
    K_R: 512
    K_T: 128
  - name: auto
    mode: auto
