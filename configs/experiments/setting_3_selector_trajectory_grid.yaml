experiment:
  id: setting_3_selector_trajectory_grid_20260724
  name: "Setting 3 selector and trajectory constraint sweep"

# Reuse the compatible legacy caches. Corrected Adam features receive a
# separate cache suffix in make_rebuttal_command_arrays.py.
shared_cache_experiment_id: setting_3_empathetic_esconv_gsm8k_legacy
output_root: outputs/setting_3_selector_trajectory_grid_20260724

repeats:
  - repeat_index: 0
    repeat_seed: 42
    run_seed: 42
    target_split_seed: 3042
    reference_split_seed: 4042
    preconditioner_split_seed: 5042
    candidate_subsample_seed: 6042
    repeat_tag: rep00_seed42
  - repeat_index: 1
    repeat_seed: 43
    run_seed: 43
    target_split_seed: 3043
    reference_split_seed: 4043
    preconditioner_split_seed: 5043
    candidate_subsample_seed: 6043
    repeat_tag: rep01_seed43
  - repeat_index: 2
    repeat_seed: 44
    run_seed: 44
    target_split_seed: 3044
    reference_split_seed: 4044
    preconditioner_split_seed: 5044
    candidate_subsample_seed: 6044
    repeat_tag: rep02_seed44
  - repeat_index: 3
    repeat_seed: 45
    run_seed: 45
    target_split_seed: 3045
    reference_split_seed: 4045
    preconditioner_split_seed: 5045
    candidate_subsample_seed: 6045
    repeat_tag: rep03_seed45
  - repeat_index: 4
    repeat_seed: 46
    run_seed: 46
    target_split_seed: 3046
    reference_split_seed: 4046
    preconditioner_split_seed: 5046
    candidate_subsample_seed: 6046
    repeat_tag: rep04_seed46

seed: "{run_seed}"

# The currently prepared seed-specific pools are reused so that this sweep
# remains compatible with the existing gradients.
data:
  candidate_file: data/setting_3_empathetic_esconv_gsm8k/legacy_prepared_{repeat_tag}/candidate_pool.jsonl
  target_file: data/setting_3_empathetic_esconv_gsm8k/legacy_prepared_{repeat_tag}/target_all.jsonl
  ood_eval_file: data/setting_3_empathetic_esconv_gsm8k/legacy_prepared_{repeat_tag}/reference_eval/gsm8k_test.jsonl
  reference_file: data/setting_3_empathetic_esconv_gsm8k/legacy_prepared_{repeat_tag}/reference_prompts.jsonl
  reference_validation_file: data/setting_3_empathetic_esconv_gsm8k/legacy_prepared_{repeat_tag}/reference_validation.jsonl
  reference_test_file: data/setting_3_empathetic_esconv_gsm8k/legacy_prepared_{repeat_tag}/reference_test.jsonl

model_variants:
  - name: olmo7b_instruct_gradient_equals_ft
    gradient_model: allenai/OLMo-2-1124-7B-Instruct
    finetune_model: allenai/OLMo-2-1124-7B-Instruct
    enabled: true

run_baselines: true
baseline_selectors: ["random", "dsir", "less", "prismatic"]
baseline_variants:
  - name: random
    selector: random
  - name: dsir
    selector: dsir
  - name: less_no_kl
    selector: less
    kl_regularization_lambda: 0.0
  - name: less_kl_0.01
    selector: less
    kl_regularization_lambda: 0.01
  - name: less_kl_0.1
    selector: less
    kl_regularization_lambda: 0.1
  - name: less_kl_1.0
    selector: less
    kl_regularization_lambda: 1.0
  - name: prismatic_no_kl
    selector: prismatic
    kl_regularization_lambda: 0.0
  - name: prismatic_kl_0.01
    selector: prismatic
    kl_regularization_lambda: 0.01
  - name: prismatic_kl_0.1
    selector: prismatic
    kl_regularization_lambda: 0.1
  - name: prismatic_kl_1.0
    selector: prismatic
    kl_regularization_lambda: 1.0

subset_percentages: [20.0]

splits:
  target: [100.0, 8741.0, 8742.0]
  target_seed: "{target_split_seed}"
  reference: [0.7, 0.3]
  reference_seed: "{reference_split_seed}"

selection:
  selector_feature_method: low_rank
  selector_preconditioner: adam
  adam_selection_mode: post_projection
  preconditioner_split_seed: "{preconditioner_split_seed}"
  selector_projection_seed: 13
  save_selected_artifacts: true
  selection_torch_dtype: bf16
  max_seq_len: 1024
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  adam_warmup_steps: 0.1
  selection_candidate_max_examples: 5000
  selection_candidate_subsample_seed: "{candidate_subsample_seed}"
  legacy_disjoint_preconditioner_pool: true
  reference_fisher_max_examples: 128
  validation_gradient_max_examples: 128
  low_rank_target_max_examples: 100
  low_rank_candidate_max_examples: 512
  low_rank_candidate_projection_chunk_rows: 128
  safe_geometry: reference
  safe_learning_rate: 2.0e-4
  safe_feasibility_tolerance: 1.0e-6
  safe_objective_tolerance: 1.0e-12
  safe_greedy_swap_passes: 1
  safe_epsilon_calibration_samples: 64
  safe_epsilon_calibration_seed: "{candidate_subsample_seed}"
  compute_validation_gradient: true
  compute_reference_fisher: true

rank_grid:
  - name: KR64_KT16
    K_R: 64
    K_T: 16
    K: 80

safe:
  epsilon: null
  rho_values: []
  variants:
    - name: safe_original_greedy
      safe_solver: greedy_marginal
      adam_selection_mode: post_projection
      safe_training_constraint_mode: none
      epsilon_multipliers: [0.5, 1.0, 2.0]
      gamma_values: [0.01, 0.1, 1.0]
    - name: safe_constrained_greedy
      safe_solver: constrained_greedy
      adam_selection_mode: post_projection
      safe_training_constraint_mode: none
      epsilon_multipliers: [0.5, 1.0, 2.0]
      gamma_values: [0.01, 0.1, 1.0]
    - name: safe_relaxed
      safe_solver: relaxed
      adam_selection_mode: post_projection
      safe_training_constraint_mode: none
      epsilon_multipliers: [0.5, 1.0, 2.0]
      gamma_values: [0.01, 0.1, 1.0]
    - name: safe_adam_corrected
      safe_solver: constrained_greedy
      adam_selection_mode: precondition_before_projection
      safe_training_constraint_mode: none
      epsilon_multipliers: [0.5, 1.0, 2.0]
      gamma_values: [0.01, 0.1, 1.0]
    - name: safe_trajectory_cumulative
      safe_solver: constrained_greedy
      adam_selection_mode: post_projection
      safe_training_constraint_mode: cumulative_line_search
      safe_training_epsilon_scale_by_steps: true
      epsilon_multipliers: [1.0, 5.0]
      rho_values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
    - name: safe_trajectory_equal_allocation
      safe_solver: constrained_greedy
      adam_selection_mode: post_projection
      safe_training_constraint_mode: equal_allocation
      safe_training_epsilon_scale_by_steps: true
      epsilon_multipliers: [1.0, 5.0]
      rho_values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]

training:
  train_lora_r: 8
  train_lora_alpha: 16
  train_torch_dtype: bf16
  train_lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  num_train_epochs: 1.0
  save_steps: 0
  eval_steps: 25
  trajectory_eval_steps: 10
  trajectory_reference_max_examples: 64
  trajectory_target_max_examples: 64
  trajectory_generation_eval_steps: 10
  trajectory_generation_max_examples: 16
  trajectory_generation_max_new_tokens: 32
  trajectory_target_evaluator: esconv
  trajectory_reference_evaluator: gsm8k
  kl_reference_max_examples: 128

evaluation:
  evaluator: esconv
  ood_evaluator: none
  reference_evaluator: gsm8k
  compute_entanglement_metrics: false
  entanglement_target_sample_size: 128
  entanglement_selected_csv_max_rows: 5000
  run_entanglement_analysis: false
  benchmark_evals: ["mmlu", "gsm8k"]
  benchmark_max_examples: 200
  eval_max_examples: 200
