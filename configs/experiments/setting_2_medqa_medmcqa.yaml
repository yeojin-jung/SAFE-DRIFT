experiment:
  id: setting_2_medqa_medmcqa_legacy
  name: "Setting 2 legacy reproduction: MedQA / MedMCQA / TruthfulQA+BBQ+IFEval"

repeats:
  - repeat_index: 0
    repeat_seed: 42
    run_seed: 42
    target_sample_seed: 42
    repeat_tag: repeat_00
  - repeat_index: 1
    repeat_seed: 43
    run_seed: 2045
    target_sample_seed: 10049
    repeat_tag: repeat_01
  - repeat_index: 2
    repeat_seed: 44
    run_seed: 4048
    target_sample_seed: 20056
    repeat_tag: repeat_02

seed: "{run_seed}"

prepare:
  - command:
      - python
      - scripts/data/prepare_medical_data.py
      - --out
      - data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}
      - --seed
      - "13"
      - --target-sample-seed
      - "{target_sample_seed}"
      - --max-target-train
      - "256"
      - --max-candidates
      - "2000"
      - --max-candidate-validation
      - "0"
      - --max-candidate-test
      - "0"
      - --max-reference-per-dataset
      - "256"
      - --max-reference-validation-per-dataset
      - "0"
      - --max-reference-test-per-dataset
      - "0"
      - --candidate-source
      - medmcqa
      - --reference-datasets
      - ifeval,truthfulqa,bbq
      - --legacy-reuse-reference-for-eval
      - --overwrite

data:
  candidate_file: data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}/candidate_pool.jsonl
  target_file: data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}/target_train.jsonl
  validation_file: data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}/target_dev.jsonl
  eval_file: data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}/target_test.jsonl
  ood_eval_file: data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}/reference_test.jsonl
  reference_file: data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}/reference_prompts.jsonl
  reference_validation_file: data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}/reference_eval/ifeval.jsonl
  reference_test_file: data/setting_2_medqa_medmcqa_truthfulqa_bbq/prepared_{repeat_tag}/reference_eval/ifeval.jsonl

model_variants:
  - name: olmo7b_instruct_gradient_equals_ft
    gradient_model: allenai/OLMo-2-1124-7B-Instruct
    finetune_model: allenai/OLMo-2-1124-7B-Instruct
    enabled: true
  - name: olmo7b_instruct_to_base_transfer
    gradient_model: allenai/OLMo-2-1124-7B-Instruct
    finetune_model: allenai/OLMo-2-1124-7B
    enabled: false
  - name: olmo7b_instruct_to_qwen_transfer
    gradient_model: allenai/OLMo-2-1124-7B-Instruct
    finetune_model: Qwen/Qwen2.5-7B
    enabled: false
  - name: olmo7b_instruct_to_mistral_transfer
    gradient_model: allenai/OLMo-2-1124-7B-Instruct
    finetune_model: mistralai/Mistral-7B-v0.3
    enabled: false

baseline_selectors: ["random", "dsir", "less", "prismatic"]
subset_percentages: [25.6]

splits:
  target: [1.0, 0.0, 0.0]
  target_seed: "{run_seed}"
  reference: [0.7, 0.3]
  reference_seed: 42

selection:
  selector_feature_method: low_rank
  selector_preconditioner: adam
  preconditioner_split_seed: 42
  selector_projection_seed: 13
  save_selected_artifacts: true
  less_similarity: cosine
  selection_torch_dtype: bf16
  max_seq_len: 1024
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  adam_warmup_steps: 0.1
  low_rank_builder_alpha: 1.0e-3
  low_rank_delta: 0.01
  low_rank_delta_task: 0.01
  reference_fisher_max_examples: 256
  validation_gradient_max_examples: 256
  low_rank_target_max_examples: 256
  low_rank_candidate_max_examples: 256
  low_rank_candidate_projection_chunk_rows: 128
  safe_geometry: reference
  safe_solver: greedy_marginal
  safe_learning_rate: 2.0e-4
  compute_validation_gradient: true
  compute_reference_fisher: true

rank_grid:
  - name: KR64_KT16
    K_R: 64
    K_T: 16
    K: 80

safe:
  epsilon: 1.0
  epsilon_values: [1.0]
  rho_values: [1.0e-5, 1.0e-2, 1.0]
  variants:
    - name: safe_reference_precondadam
      selector_feature_method: low_rank
      selector_preconditioner: adam
      safe_geometry: reference
      safe_solver: greedy_marginal
    - name: safe_reference_precondsgd
      selector_feature_method: low_rank
      selector_preconditioner: sgd
      safe_geometry: reference
      safe_solver: greedy_marginal
    - name: safe_reference_cumulative_precondadam
      selector_feature_method: low_rank
      selector_preconditioner: adam
      safe_geometry: reference
      safe_solver: greedy_marginal
      safe_training_constraint_mode: cumulative_line_search
    - name: safe_reference_cumulative_precondsgd
      selector_feature_method: low_rank
      selector_preconditioner: sgd
      safe_geometry: reference
      safe_solver: greedy_marginal
      safe_training_constraint_mode: cumulative_line_search
    - name: safe_reference_constrained_precondadam
      selector_feature_method: low_rank
      selector_preconditioner: adam
      safe_geometry: reference
      safe_solver: constrained_greedy
    - name: safe_reference_constrained_precondsgd
      selector_feature_method: low_rank
      selector_preconditioner: sgd
      safe_geometry: reference
      safe_solver: constrained_greedy
    - name: safe_reference_relaxed_precondadam
      selector_feature_method: low_rank
      selector_preconditioner: adam
      safe_geometry: reference
      safe_solver: relaxed
    - name: safe_reference_relaxed_precondsgd
      selector_feature_method: low_rank
      selector_preconditioner: sgd
      safe_geometry: reference
      safe_solver: relaxed
    - name: safe_euclidean_precondadam
      selector_feature_method: low_rank
      selector_preconditioner: adam
      safe_geometry: euclidean
      safe_solver: greedy_marginal
    - name: safe_euclidean_precondsgd
      selector_feature_method: low_rank
      selector_preconditioner: sgd
      safe_geometry: euclidean
      safe_solver: greedy_marginal
    - name: safe_rank_precondadam
      selector_feature_method: low_rank
      selector_preconditioner: adam
      safe_geometry: reference
      safe_solver: rank
    - name: safe_rank_precondsgd
      selector_feature_method: low_rank
      selector_preconditioner: sgd
      safe_geometry: reference
      safe_solver: rank
    - name: safe_random_sketch_precondadam
      selector_feature_method: random_sketch
      selector_preconditioner: adam
      safe_geometry: reference
      safe_solver: greedy_marginal
    - name: safe_random_sketch_precondsgd
      selector_feature_method: random_sketch
      selector_preconditioner: sgd
      safe_geometry: reference
      safe_solver: greedy_marginal

training:
  train_lora_r: 16
  train_lora_alpha: 32
  train_torch_dtype: bf16
  train_lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  num_train_epochs: 2.0
  eval_steps: 0
  save_steps: 0

evaluation:
  evaluator: medqa
  ood_evaluator: medical_reference
  reference_evaluator: ifeval_proxy
  generation_max_new_tokens: 32
  ood_generation_max_new_tokens: 64
  reference_generation_max_new_tokens: 96
  compute_entanglement_metrics: false
  entanglement_target_sample_size: 128
  entanglement_selected_csv_max_rows: 5000
  run_entanglement_analysis: false
  benchmark_evals: []
