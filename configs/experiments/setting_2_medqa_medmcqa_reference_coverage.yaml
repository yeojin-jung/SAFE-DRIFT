experiment:
  id: setting_2_medqa_medmcqa_reference_coverage_v1
  name: "Setting 2 leave-one-reference-out coverage: MedMCQA -> MedQA"

repeats:
  - repeat_index: 0
    repeat_seed: 42
    run_seed: 42
    target_sample_seed: 42
    repeat_tag: repeat_00
  - repeat_index: 1
    repeat_seed: 43
    run_seed: 43
    target_sample_seed: 43
    repeat_tag: repeat_01
  - repeat_index: 2
    repeat_seed: 44
    run_seed: 44
    target_sample_seed: 44
    repeat_tag: repeat_02

seed: "{run_seed}"
output_root: /lambda/nfs/mem/safe-drift/outputs
shared_cache_root: /lambda/nfs/mem/safe-drift/shared_cache

prepare:
  - command:
      - python
      - scripts/data/prepare_medical_data.py
      - --out
      - /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}
      - --seed
      - "{repeat_seed}"
      - --target-sample-seed
      - "{target_sample_seed}"
      - --max-target-train
      - "256"
      - --max-candidates
      - "2000"
      - --max-candidate-validation
      - "0"
      - --max-candidate-test
      - "0"
      - --max-reference-per-dataset
      - "256"
      - --max-reference-validation-per-dataset
      - "128"
      - --max-reference-test-per-dataset
      - "256"
      - --reference-mixture-total-budget
      - "256"
      - --candidate-source
      - medmcqa
      - --reference-datasets
      - bbq,truthfulqa,mmlu_non_medical
      - --eval-only-datasets
      - ifeval
      - --reference-mixtures
      - B_T=bbq+truthfulqa,B_K=bbq+mmlu_non_medical,T_K=truthfulqa+mmlu_non_medical,B_T_K=bbq+truthfulqa+mmlu_non_medical
      - --overwrite

data:
  candidate_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/candidate_pool.jsonl
  target_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/target_train.jsonl
  validation_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/target_dev.jsonl
  eval_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/target_test.jsonl
  ood_eval_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_eval/mcq_ood_test.jsonl
  reference_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_mixtures/B_T.jsonl
  reference_validation_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_validation.jsonl
  reference_test_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_test.jsonl

reference_compositions:
  - name: B_T
    domains: [bbq, truthfulqa]
    reference_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_mixtures/B_T.jsonl
  - name: B_K
    domains: [bbq, mmlu_non_medical]
    reference_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_mixtures/B_K.jsonl
  - name: T_K
    domains: [truthfulqa, mmlu_non_medical]
    reference_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_mixtures/T_K.jsonl
  - name: B_T_K
    domains: [bbq, truthfulqa, mmlu_non_medical]
    reference_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_mixtures/B_T_K.jsonl

model_variants:
  - name: olmo7b_instruct
    gradient_model: allenai/OLMo-2-1124-7B-Instruct
    finetune_model: allenai/OLMo-2-1124-7B-Instruct
    enabled: true

run_baselines: true
baseline_variants:
  - name: less_no_reference
    selector: less
    selector_feature_method: random_sketch
    selector_preconditioner: sgd
    reference_file: null

subset_percentages: [25.6]

splits:
  target: [1.0, 0.0, 0.0]
  target_seed: "{run_seed}"
  reference: [1.0, 0.0]
  reference_seed: "{run_seed}"

selection:
  selector_feature_method: low_rank
  selector_preconditioner: sgd
  preconditioner_split_seed: "{run_seed}"
  selector_projection_seed: "{run_seed}"
  save_selected_artifacts: true
  save_all_target_features: true
  less_similarity: cosine
  selection_torch_dtype: bf16
  max_seq_len: 1024
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  adam_warmup_steps: 0.1
  low_rank_builder_alpha: 1.0e-3
  low_rank_delta: 0.01
  low_rank_delta_task: 0.01
  reference_fisher_max_examples: 256
  validation_gradient_max_examples: 256
  low_rank_target_max_examples: 256
  low_rank_candidate_max_examples: 256
  low_rank_candidate_projection_chunk_rows: 128
  safe_geometry: reference
  safe_solver: greedy_marginal
  safe_learning_rate: 2.0e-4
  compute_validation_gradient: true
  compute_reference_fisher: true
  resume_completed_runs: true

rank_grid:
  - name: KR64_KT16
    K_R: 64
    K_T: 16
    K: 80

safe:
  epsilon_values: [1.0e-4]
  rho_values: []
  beta_values: [0.3]
  variants:
    - name: safe_reference_precondsgd
      selector_feature_method: low_rank
      selector_preconditioner: sgd
      safe_geometry: reference
      safe_solver: greedy_marginal

training:
  train_lora_r: 16
  train_lora_alpha: 32
  train_lora_dropout: 0.05
  train_torch_dtype: bf16
  train_lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  train_max_seq_length: 1024
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  num_train_epochs: 2.0
  logging_steps: 1
  eval_steps: 0
  save_steps: 0
  gradient_checkpointing: true
  kl_reference_max_examples: 64
  trajectory_eval_steps: 4
  trajectory_reference_max_examples: 32
  trajectory_target_max_examples: 64
  trajectory_generation_eval_steps: 16
  trajectory_generation_max_examples: 16
  trajectory_generation_max_new_tokens: 64

evaluation:
  evaluator: medqa
  ood_evaluator: mcq_ood
  reference_evaluator: medical_reference
  trajectory_target_evaluator: medqa
  trajectory_reference_evaluator: medical_reference
  trajectory_instruction_file: /lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_eval/ifeval_validation.jsonl
  trajectory_instruction_evaluator: ifeval_proxy
  generation_max_new_tokens: 64
  ood_generation_max_new_tokens: 8
  reference_generation_max_new_tokens: 64
  eval_max_examples: 256
  extra_evals:
    - bbq=medical_reference:/lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_eval/bbq_test.jsonl
    - truthfulqa=medical_reference:/lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_eval/truthfulqa_test.jsonl
    - mmlu_non_medical=mmlu:/lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_eval/mmlu_non_medical_test.jsonl
    - ifeval=ifeval_proxy:/lambda/nfs/mem/safe-drift/data/setting_2_reference_coverage/prepared_{repeat_tag}/reference_eval/ifeval_test.jsonl
  benchmark_evals: []
  compute_entanglement_metrics: true
  entanglement_target_sample_size: 128
  entanglement_selected_csv_max_rows: 5000
  run_entanglement_analysis: false
